<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance App</title>
  <style>
    :root {
      --bg: #090909;
      --panel: rgba(18, 18, 18, 0.9);
      --panel-alt: #121212;
      --accent: #ff7a1a;
      --accent-soft: #ffb067;
      --text: #ff8a2e;
      --muted: #f5caa1;
      --success: #ff9a3d;
      --warning: #ffb347;
      --danger: #ff5a36;
      --info: #ffd29d;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: contain;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }

    body {
      position: relative;
      padding: 24px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding-top: 60px;
    }

    #app-title {
      margin: 0 0 12px;
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.04em;
    }

    #scanner-prompt {
      margin: 0 0 24px;
      font-size: clamp(18px, 2.6vw, 28px);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--muted);
    }

    #status-card {
      display: none;
      width: min(82vw, 520px);
      text-align: center;
      padding: 24px 22px;
      background: rgba(18, 18, 18, 0.96);
      border: 1px solid rgba(255, 122, 26, 0.35);
      border-radius: 22px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.28);
      margin: 0 auto;
      transition: all 0.2s ease;
    }

    #status-action {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #status-name {
      margin: 12px 0 8px;
      font-size: clamp(20px, 3.5vw, 36px);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      word-break: break-word;
    }

    #status-time {
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 2vw, 18px);
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    #scanner-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      border: none;
      padding: 0;
      margin: 0;
      transform: scale(0.1);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- SCANNER VIEW -->
  <div id="scanner-view" class="view">
    <h1 id="app-title">ROBOSTANGS</h1>
    <p id="scanner-prompt">SCAN YOUR MEMBER PASS</p>
    
    <div id="status-card">
      <h2 id="status-action" style="margin:0;"></h2>
      <h3 id="status-name" style="margin:10px 0 5px 0;"></h3>
      <p id="status-time" style="margin:0; color:#ccc;"></p>
    </div>

    <input type="text" id="scanner-input" style="opacity: 0; position: absolute; pointer-events: none;" autofocus />
  </div>

  <script src="app.js"></script>
</body>
</html>
