<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance App</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <button id="mode-toggle" type="button">MEETING</button>

  <div id="event-prompt-modal" aria-hidden="true">
    <div class="event-prompt-card">
      <h2 id="event-selection-title">Select today's event</h2>
      <div id="event-selection-list" class="event-selection-list"></div>
      <div class="event-prompt-actions">
        <button type="button" class="event-prompt-cancel">Cancel</button>
        <button type="button" class="event-prompt-submit">Select event</button>
      </div>
    </div>
  </div>

  <div id="scanner-view" class="view">
    <h1 id="app-title">ROBOSTANGS</h1>
    <p id="scanner-prompt" style="display: none;">SCAN YOUR MEMBER PASS</p>
    <p id="scanner-subtext" class="scanner-subtext" style="display: none;">SCAN IN / SCAN OUT</p>
    
    <div id="status-card">
      <h2 id="status-action" style="margin:0;"></h2>
      <h3 id="status-name" style="margin:10px 0 5px 0;"></h3>
      <p id="status-time" style="margin:0; color:#ccc;"></p>
    </div>

    <input type="text" id="scanner-input" style="opacity: 0; position: absolute; pointer-events: none;" autofocus />
  </div>

  <script src="attendance-logic.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
