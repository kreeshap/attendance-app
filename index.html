<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance App</title>
  <style>
    body {
      background-color: #0d1b24;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      position: relative;
    }
    .view { display: block; }

    #mode-toggle {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 118px;
      height: 44px;
      border-radius: 10px;
      border: 2px solid #e06328;
      background: #1a2f3b;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      z-index: 2;
    }

    #mode-toggle.outreach {
      background: #e06328;
      border-color: #f6b87a;
      color: #111827;
    }

    #event-name-label {
      position: absolute;
      top: 18px;
      right: 18px;
      font-size: 18px;
      font-weight: 700;
      color: #f5d7a2;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: none;
      z-index: 2;
    }

    #event-prompt-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #event-prompt-modal.visible {
      display: flex;
    }

    .event-prompt-card {
      width: min(420px, calc(100vw - 32px));
      background: #1a2f3b;
      border: 2px solid #e06328;
      border-radius: 16px;
      padding: 24px 20px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .event-prompt-card h2 {
      margin: 0 0 14px;
      font-size: 24px;
      color: #ffffff;
    }

    .event-prompt-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e06328;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .event-prompt-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .event-prompt-actions button {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .event-prompt-cancel {
      background: #374151;
      color: #fff;
    }

    .event-prompt-submit {
      background: #e06328;
      color: #111827;
    }

    #status-card {
      display: none;
      margin: 20px auto;
      padding: 20px;
      width: 300px;
      background: #1a2f3b;
      border: 2px solid #e06328;
      border-radius: 8px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <button id="mode-toggle" type="button">MEETING</button>
  <div id="event-name-label">EVENT NAME</div>

  <div id="event-prompt-modal" aria-hidden="true">
    <div class="event-prompt-card">
      <h2>Enter Event Name</h2>
      <input id="event-name-input" type="text" maxlength="80" placeholder="Event name" />
      <div class="event-prompt-actions">
        <button type="button" class="event-prompt-cancel">Cancel</button>
        <button type="button" class="event-prompt-submit">OK</button>
      </div>
    </div>
  </div>

  <!-- SCANNER VIEW -->
  <div id="scanner-view" class="view">
    <h1 id="app-title">ROBOSTANGS</h1>
    <p id="scanner-prompt">SCAN YOUR MEMBER PASS</p>
    
    <div id="status-card">
      <h2 id="status-action" style="margin:0;"></h2>
      <h3 id="status-name" style="margin:10px 0 5px 0;"></h3>
      <p id="status-time" style="margin:0; color:#ccc;"></p>
    </div>

    <input type="text" id="scanner-input" style="opacity: 0; position: absolute; pointer-events: none;" autofocus />
  </div>

  <script src="app.js"></script>
</body>
</html>
